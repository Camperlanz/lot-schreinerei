<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lot — Artikel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
/* =========================================================================
   Lot — Artikel erfassen
   Tokens identisch zu design/tokens.css (inline, damit die Seite allein läuft)
   ========================================================================= */
:root{
  --raw-o-50:#FFF4ED; --raw-o-100:#FFE4D3; --raw-o-200:#FFC5A3; --raw-o-300:#FFA96F;
  --raw-o-400:#FF8A3D; --raw-o-500:#F26419; --raw-o-600:#D2500C; --raw-o-700:#A93C08;
  --raw-o-800:#7C2C07; --raw-o-900:#4E1C05;
  --raw-n-0:#FFFFFF; --raw-n-25:#FCFAF8; --raw-n-50:#FAF7F4; --raw-n-100:#F2EDE8;
  --raw-n-200:#E4DCD4; --raw-n-300:#CDC3B9; --raw-n-400:#A79C91; --raw-n-500:#7E746A;
  --raw-n-600:#5C554E; --raw-n-700:#423C36; --raw-n-800:#26211D; --raw-n-900:#171310;
  --raw-n-950:#100D0B;
  --raw-ok-500:#1F7A4D; --raw-ok-400:#4FBF87; --raw-ok-50:#E7F4EC;
  --raw-warn-700:#8A5A00; --raw-warn-400:#F5B301; --raw-warn-50:#FDF3DC;
  --raw-err-600:#B3261E; --raw-err-400:#FF6B60; --raw-err-50:#FCEAE8;
}
:root{
  color-scheme:light;
  --bg-app:var(--raw-n-50); --bg-surface:var(--raw-n-0); --bg-raised:var(--raw-n-25);
  --bg-sunken:var(--raw-n-100);
  --text-strong:var(--raw-n-900); --text-base:var(--raw-n-700);
  --text-muted:var(--raw-n-600); --text-faint:var(--raw-n-500);
  --text-on-brand:var(--raw-n-900);
  --border-subtle:var(--raw-n-200); --border-base:var(--raw-n-300); --border-strong:var(--raw-n-400);
  --brand:var(--raw-o-500); --brand-hover:var(--raw-o-600); --brand-active:var(--raw-o-700);
  --brand-text:var(--raw-o-700); --brand-quiet:var(--raw-o-50); --brand-quiet-bd:var(--raw-o-200);
  --focus-ring:var(--raw-o-600);
  --ok-text:var(--raw-ok-500); --ok-bg:var(--raw-ok-50); --ok-bd:#A8D8BC;
  --warn-text:var(--raw-warn-700); --warn-bg:var(--raw-warn-50); --warn-bd:#E8C777;
  --err-text:var(--raw-err-600); --err-bg:var(--raw-err-50); --err-bd:#EFA9A3;
  --shadow-1:0 1px 2px rgba(35,25,18,.07),0 1px 1px rgba(35,25,18,.04);
  --r-sm:4px; --r-md:8px; --r-lg:12px; --r-pill:999px;
  --touch-min:44px; --touch-comfort:56px;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",Consolas,monospace;
  --topbar-bg:var(--raw-n-900); --topbar-text:var(--raw-n-100); --topbar-muted:var(--raw-n-400);
  --topbar-line:#332C26;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg-app:var(--raw-n-950); --bg-surface:var(--raw-n-900); --bg-raised:var(--raw-n-800);
    --bg-sunken:#0A0806;
    --text-strong:var(--raw-n-100); --text-base:#DFD8D1;
    --text-muted:var(--raw-n-300); --text-faint:var(--raw-n-400);
    --text-on-brand:var(--raw-n-950);
    --border-subtle:#2E2823; --border-base:var(--raw-n-700); --border-strong:var(--raw-n-600);
    --brand-hover:var(--raw-o-400); --brand-active:var(--raw-o-300);
    --brand-text:var(--raw-o-400); --brand-quiet:#2A1810; --brand-quiet-bd:#5A3218;
    --focus-ring:var(--raw-o-400);
    --ok-text:var(--raw-ok-400); --ok-bg:#0E2B1C; --ok-bd:#1F5638;
    --warn-text:var(--raw-warn-400); --warn-bg:#2E2205; --warn-bd:#6B5008;
    --err-text:var(--raw-err-400); --err-bg:#2E1210; --err-bd:#6E2A24;
    --shadow-1:0 1px 2px rgba(0,0,0,.5);
    --topbar-bg:#0B0908; --topbar-line:#241F1B;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg-app:var(--raw-n-950); --bg-surface:var(--raw-n-900); --bg-raised:var(--raw-n-800);
  --bg-sunken:#0A0806;
  --text-strong:var(--raw-n-100); --text-base:#DFD8D1;
  --text-muted:var(--raw-n-300); --text-faint:var(--raw-n-400);
  --text-on-brand:var(--raw-n-950);
  --border-subtle:#2E2823; --border-base:var(--raw-n-700); --border-strong:var(--raw-n-600);
  --brand-hover:var(--raw-o-400); --brand-active:var(--raw-o-300);
  --brand-text:var(--raw-o-400); --brand-quiet:#2A1810; --brand-quiet-bd:#5A3218;
  --focus-ring:var(--raw-o-400);
  --ok-text:var(--raw-ok-400); --ok-bg:#0E2B1C; --ok-bd:#1F5638;
  --warn-text:var(--raw-warn-400); --warn-bg:#2E2205; --warn-bd:#6B5008;
  --err-text:var(--raw-err-400); --err-bg:#2E1210; --err-bd:#6E2A24;
  --shadow-1:0 1px 2px rgba(0,0,0,.5);
  --topbar-bg:#0B0908; --topbar-line:#241F1B;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg-app); color:var(--text-base);
  font:400 16px/1.6 var(--f-body); -webkit-font-smoothing:antialiased;
}

/* Kopfleiste */
.topbar{
  background:var(--topbar-bg); color:var(--topbar-text);
  border-bottom:1px solid var(--topbar-line);
  padding:12px 20px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
}
.brand{display:flex; align-items:baseline; gap:10px; margin-right:auto}
.brand b{font:700 21px/1 var(--f-display); letter-spacing:.02em}
.brand b span{color:var(--brand)}
.brand em{
  font:500 12px/1 var(--f-mono); font-style:normal; letter-spacing:.1em;
  text-transform:uppercase; color:var(--topbar-muted);
  border-left:1px solid var(--topbar-line); padding-left:10px;
}
.ghost{
  min-height:var(--touch-min); padding:0 13px;
  display:inline-flex; align-items:center; gap:8px; text-decoration:none;
  background:transparent; color:var(--topbar-muted);
  border:1px solid var(--topbar-line); border-radius:var(--r-pill);
  font:500 13px/1 var(--f-body); cursor:pointer;
}
.ghost:hover{color:var(--topbar-text); border-color:var(--topbar-muted)}
.ghost .dot{width:9px; height:9px; border-radius:50%; background:var(--brand)}

/* Layout */
.page{max-width:1080px; margin:0 auto; padding:24px 20px 72px}
.head{display:flex; align-items:flex-end; gap:14px; flex-wrap:wrap; margin-bottom:18px}
.head h2{margin:0; font:600 21px/1.2 var(--f-display); color:var(--text-strong); letter-spacing:-.01em}
.head .right{margin-left:auto; display:flex; gap:10px; flex-wrap:wrap}

.panel{
  background:var(--bg-surface); border:1px solid var(--border-subtle);
  border-radius:var(--r-lg); box-shadow:var(--shadow-1); margin-bottom:18px;
}
.panel-head{
  padding:13px 16px; border-bottom:1px solid var(--border-subtle);
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  font:600 11px/1 var(--f-mono); letter-spacing:.1em; text-transform:uppercase;
  color:var(--text-muted);
}
.panel-head .free{
  margin-left:auto; font:400 12px/1 var(--f-mono); letter-spacing:0;
  text-transform:none; color:var(--text-faint);
}
.panel-body{padding:16px; display:flex; flex-direction:column; gap:16px}

/* Formular */
.rows{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px}
.field{display:flex; flex-direction:column; gap:7px}
.field.wide{grid-column:1/-1}
.field label{
  font:500 12px/1 var(--f-mono); letter-spacing:.08em; text-transform:uppercase;
  color:var(--text-muted);
}
.field .note{font:400 12px/1.4 var(--f-body); color:var(--text-faint)}
input[type="text"],input[type="number"],input[type="search"],select{
  width:100%; min-height:var(--touch-comfort); padding:0 14px;
  background:var(--bg-sunken); color:var(--text-strong);
  border:1px solid var(--border-base); border-radius:var(--r-md);
  font:400 16px/1.4 var(--f-body);
}
select{
  appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),
                   linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 20px) 50%, calc(100% - 14px) 50%;
  background-size:6px 6px, 6px 6px;
  background-repeat:no-repeat;
  padding-right:42px; cursor:pointer;
}
input[type="number"],input.nr{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
input::placeholder{color:var(--text-faint)}
input:hover,select:hover{border-color:var(--border-strong)}
input:focus,select:focus{background:var(--bg-surface)}

.b{
  min-height:var(--touch-comfort); padding:0 20px; border-radius:var(--r-md);
  border:1px solid transparent; cursor:pointer; font:600 16px/1 var(--f-body);
  display:inline-flex; align-items:center; justify-content:center; gap:9px;
  text-decoration:none;
}
.b-primary{background:var(--brand); color:var(--text-on-brand)}
.b-primary:hover{background:var(--brand-hover)}
.b-primary:active{background:var(--brand-active); color:#fff}
.b-secondary{background:var(--bg-surface); color:var(--text-strong); border-color:var(--border-base)}
.b-secondary:hover{background:var(--bg-sunken); border-color:var(--border-strong)}
.b-sm{min-height:var(--touch-min); padding:0 14px; font-size:14px}
.b-danger{background:transparent; color:var(--err-text); border-color:var(--err-bd)}
.b-danger:hover{background:var(--err-bg)}
.formbtns{display:flex; gap:10px; flex-wrap:wrap}

/* Tabelle */
.tscroll{overflow-x:auto}
table{width:100%; border-collapse:collapse; font-size:14px}
th{
  text-align:left; padding:11px 13px; background:var(--bg-sunken); white-space:nowrap;
  font:600 11px/1 var(--f-mono); letter-spacing:.08em; text-transform:uppercase;
  color:var(--text-muted); border-bottom:1px solid var(--border-base);
}
td{padding:11px 13px; border-bottom:1px solid var(--border-subtle); color:var(--text-base)}
tbody tr:last-child td{border-bottom:0}
tbody tr.editing td{background:var(--brand-quiet)}
tbody tr.editing td:first-child{box-shadow:inset 3px 0 0 var(--brand)}
.num{font-family:var(--f-mono); font-variant-numeric:tabular-nums; white-space:nowrap}
.right{text-align:right}
td.strong{color:var(--text-strong); font-weight:500}
td .sub{display:block; font:400 12px/1.4 var(--f-mono); color:var(--text-faint)}
.cellbtns{display:flex; gap:7px; flex-wrap:wrap}

.msg{
  display:none; gap:10px; align-items:flex-start;
  padding:12px 14px; border-radius:var(--r-md); border:1px solid;
  font-size:14px; line-height:1.5; margin-bottom:18px;
}
.msg[data-show="1"]{display:flex}
.msg.ok{color:var(--ok-text); background:var(--ok-bg); border-color:var(--ok-bd)}
.msg.warn{color:var(--warn-text); background:var(--warn-bg); border-color:var(--warn-bd)}
.msg.err{color:var(--err-text); background:var(--err-bg); border-color:var(--err-bd)}
.msg .mark{flex:none; width:9px; height:9px; border-radius:50%; background:currentColor; margin-top:7px}
.msg b{display:block; font-weight:600}
.msg a{color:inherit}

.empty{
  padding:34px 20px; text-align:center; color:var(--text-faint);
  display:flex; flex-direction:column; gap:8px; align-items:center;
}
.empty b{color:var(--text-muted); font:600 16px/1.3 var(--f-body)}

.foot{
  margin-top:24px; padding-top:14px; border-top:1px solid var(--border-subtle);
  font:400 12px/1.6 var(--f-mono); color:var(--text-faint);
  display:flex; flex-wrap:wrap; gap:8px 20px; align-items:center;
}

:where(a,button,input,select,[tabindex]):focus-visible{
  outline:3px solid var(--focus-ring); outline-offset:2px; border-radius:var(--r-sm);
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important; transition-duration:.01ms !important}
}
</style>

<header class="topbar">
  <div class="brand"><b>LO<span>T</span></b><em>Artikel</em></div>
  <a class="ghost" href="bestellung.html">Zurück zur Bestellung</a>
  <a class="ghost" href="lieferanten.html">Lieferanten</a>
  <a class="ghost" href="etiketten.html">Etiketten</a>
  <button class="ghost" id="themeBtn" type="button">
    <span class="dot" aria-hidden="true"></span><span id="themeLabel">Dunkel</span>
  </button>
</header>

<main class="page">

  <div class="head">
    <div><h2>Artikel</h2></div>
    <div class="right">
      <input id="search" type="search" placeholder="Nummer, Bezeichnung oder Lieferant"
             aria-label="Artikel durchsuchen" style="min-width:250px">
      <button class="b b-primary" id="newBtn" type="button">Neuer Artikel</button>
    </div>
  </div>

  <div class="msg" id="msg" role="status" aria-live="polite">
    <span class="mark" aria-hidden="true"></span>
    <span><b id="msgTitle"></b><span id="msgText"></span></span>
  </div>

  <!-- Erscheint erst auf Knopfdruck -->
  <div class="panel" id="formPanel" hidden>
    <div class="panel-head" id="formHead">Neuer Artikel</div>
    <div class="panel-body">
      <div class="rows">
        <div class="field">
          <label for="fLieferant">Lieferant</label>
          <select id="fLieferant"></select>
          <span class="note">Kommt aus der Lieferantenliste.</span>
        </div>
        <div class="field">
          <label for="fCode">Artikelnummer</label>
          <input id="fCode" class="nr" type="text" autocomplete="off" autocapitalize="characters"
                 autocorrect="off" spellcheck="false" placeholder="82.1025.40040">
          <span class="note">Steht auf dem Etikett, muss eindeutig sein.</span>
        </div>
        <div class="field">
          <label for="fEinheit">Einheit</label>
          <select id="fEinheit"></select>
        </div>
        <div class="field wide">
          <label for="fName">Bezeichnung</label>
          <input id="fName" type="text" autocomplete="off"
                 placeholder="Senkkopfschraube 4,0x40 T20 m. Schaft Inox A2">
        </div>
        <div class="field">
          <label for="fOrt">Lagerort</label>
          <input id="fOrt" type="text" autocomplete="off" placeholder="Regal A / Fach 2">
          <span class="note">Damit man ihn wiederfindet.</span>
        </div>
        <div class="field">
          <label for="fIst">Anfangsbestand</label>
          <input id="fIst" type="number" min="0" step="1" value="0">
        </div>
      </div>
      <div class="formbtns">
        <button class="b b-primary" id="saveBtn" type="button">Speichern</button>
        <button class="b b-secondary" id="cancelBtn" type="button">Abbrechen</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head">Erfasst <span class="free" id="count"></span></div>
    <div class="tscroll">
      <table>
        <thead>
          <tr>
            <th scope="col">Artikelnummer</th>
            <th scope="col">Bezeichnung</th>
            <th scope="col">Lieferant</th>
            <th scope="col">Einheit</th>
            <th scope="col">Ort</th>
            <th scope="col">Aktion</th>
          </tr>
        </thead>
        <tbody id="list"></tbody>
      </table>
    </div>
  </div>

  <div class="foot">
    <span>Lot 0.1 · Entwurf</span>
    <span>Nur lokal im Browser gespeichert</span>
  </div>
</main>

<script src="stammdaten.js"></script>
<script>
(function () {
  "use strict";

  var root = document.documentElement;
  var liste = LotStamm.ladeArtikel();
  var bearbeitet = null;      /* code des Artikels im Formular, null = neu */
  var loeschKandidat = null;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }
  function finde(code) {
    for (var i = 0; i < liste.length; i++) if (liste[i].code === code) return liste[i];
    return null;
  }
  function speichern() {
    if (!LotStamm.speichereArtikel(liste)) {
      say('warn', 'Nicht dauerhaft gespeichert. ',
        'Der Browser lässt nichts ablegen — die Änderung gilt nur für diese Sitzung.');
    }
  }

  /* ---------- Hell / Dunkel ---------- */
  var themeBtn = document.getElementById('themeBtn');
  var themeLabel = document.getElementById('themeLabel');
  function systemDark(){ return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches; }
  function isDark(){
    var t = root.getAttribute('data-theme');
    if (t === 'dark') return true;
    if (t === 'light') return false;
    return systemDark();
  }
  function syncTheme(){ themeLabel.textContent = isDark() ? 'Hell' : 'Dunkel'; }
  themeBtn.addEventListener('click', function(){
    root.setAttribute('data-theme', isDark() ? 'light' : 'dark');
    syncTheme();
  });
  if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncTheme);
  }
  syncTheme();

  /* ---------- Meldungen ---------- */
  var msg = document.getElementById('msg');
  function say(kind, title, text) {
    msg.className = 'msg ' + kind;
    msg.setAttribute('data-show', '1');
    document.getElementById('msgTitle').textContent = title;
    document.getElementById('msgText').textContent = text;
  }
  function clearMsg() { msg.removeAttribute('data-show'); }

  /* ---------- Auswahllisten füllen ---------- */
  var F = {
    lieferant: document.getElementById('fLieferant'),
    code: document.getElementById('fCode'),
    name: document.getElementById('fName'),
    einheit: document.getElementById('fEinheit'),
    ort: document.getElementById('fOrt'),
    ist: document.getElementById('fIst')
  };

  function fuelleLieferanten(gewaehlt) {
    var namen = LotStamm.lieferantenNamen();
    F.lieferant.innerHTML = '';
    if (!namen.length) {
      var leer = document.createElement('option');
      leer.value = '';
      leer.textContent = 'Noch keine Lieferanten erfasst';
      F.lieferant.appendChild(leer);
      return;
    }
    namen.forEach(function (n) {
      var o = document.createElement('option');
      o.value = n; o.textContent = n;
      if (n === gewaehlt) o.selected = true;
      F.lieferant.appendChild(o);
    });
    /* Ein Lieferant, der nur noch am Artikel hängt, darf nicht verschwinden */
    if (gewaehlt && namen.indexOf(gewaehlt) === -1) {
      var alt = document.createElement('option');
      alt.value = gewaehlt;
      alt.textContent = gewaehlt + ' (nicht mehr in der Liste)';
      alt.selected = true;
      F.lieferant.insertBefore(alt, F.lieferant.firstChild);
    }
  }

  function fuelleEinheiten(gewaehlt) {
    F.einheit.innerHTML = '';
    var werte = LotStamm.EINHEITEN.slice();
    if (gewaehlt && werte.indexOf(gewaehlt) === -1) werte.unshift(gewaehlt);
    werte.forEach(function (e) {
      var o = document.createElement('option');
      o.value = e; o.textContent = e;
      if (e === gewaehlt) o.selected = true;
      F.einheit.appendChild(o);
    });
  }

  /* ---------- Formular ---------- */
  var formPanel = document.getElementById('formPanel');

  function formOeffnen(code) {
    bearbeitet = code || null;
    loeschKandidat = null;
    var a = code ? finde(code) : null;
    document.getElementById('formHead').textContent = a ? 'Artikel bearbeiten' : 'Neuer Artikel';
    fuelleLieferanten(a ? a.lieferant : '');
    fuelleEinheiten(a ? a.einheit : 'Stk');
    F.code.value    = a ? a.code : '';
    F.name.value    = a ? a.name : '';
    F.ort.value     = a ? a.ort : '';
    F.ist.value     = a ? a.ist : 0;
    /* Der Bestand wird beim Buchen geführt, nicht hier nachträglich verstellt */
    F.ist.disabled = !!a;
    formPanel.hidden = false;
    clearMsg();
    render();
    (a ? F.name : F.code).focus();
  }
  function formSchliessen() {
    formPanel.hidden = true;
    bearbeitet = null;
    render();
  }

  document.getElementById('newBtn').addEventListener('click', function () {
    if (!LotStamm.lieferantenNamen().length) {
      say('warn', 'Zuerst einen Lieferanten erfassen. ',
        'Ein Artikel braucht einen Lieferanten — den legst du unter „Lieferanten" an.');
      return;
    }
    formOeffnen(null);
  });
  document.getElementById('cancelBtn').addEventListener('click', formSchliessen);

  document.getElementById('saveBtn').addEventListener('click', function () {
    var code = F.code.value.trim().toUpperCase();
    var name = F.name.value.trim();
    var lieferant = F.lieferant.value;

    if (!code) {
      say('err', 'Artikelnummer fehlt. ', 'Ohne Nummer lässt sich das Etikett nicht zuordnen.');
      F.code.focus(); return;
    }
    if (!name) {
      say('err', 'Bezeichnung fehlt. ', 'Sonst weiss beim Scannen niemand, was in der Hand liegt.');
      F.name.focus(); return;
    }
    if (!lieferant) {
      say('err', 'Lieferant fehlt. ', 'Ohne Lieferant landet der Artikel auf keiner Bestellliste.');
      F.lieferant.focus(); return;
    }
    var doppelt = liste.some(function (x) { return x.code !== bearbeitet && x.code === code; });
    if (doppelt) {
      say('err', 'Nummer gibt es schon. ', code + ' ist bereits vergeben.');
      F.code.focus(); return;
    }
    if (bearbeitet) {
      var a = finde(bearbeitet);
      a.code = code; a.name = name; a.lieferant = lieferant;
      a.einheit = F.einheit.value; a.ort = F.ort.value.trim();
      say('ok', 'Gespeichert. ', name + ' wurde geändert.');
    } else {
      var ist = parseInt(F.ist.value, 10);
      if (isNaN(ist) || ist < 0) ist = 0;
      liste.push({
        code: code, name: name, einheit: F.einheit.value,
        lieferant: lieferant, ort: F.ort.value.trim(),
        ist: ist
      });
      say('ok', 'Erfasst. ', name + ' ist angelegt und beim Scannen sofort auffindbar.');
    }
    speichern();
    formSchliessen();
  });

  /* ---------- Liste ---------- */
  document.getElementById('search').addEventListener('input', render);

  function render() {
    var q = document.getElementById('search').value.trim().toLowerCase();
    var tb = document.getElementById('list');
    tb.innerHTML = '';

    var sortiert = liste.slice().sort(function (a, b) {
      return a.code.localeCompare(b.code, 'de', { numeric:true });
    });
    var gefiltert = sortiert.filter(function (a) {
      if (!q) return true;
      return (a.code + ' ' + a.name + ' ' + a.lieferant + ' ' + a.ort).toLowerCase().indexOf(q) !== -1;
    });

    document.getElementById('count').textContent =
      liste.length === 1 ? '1 Artikel' : liste.length + ' Artikel';

    if (!liste.length) {
      tb.innerHTML = '<tr><td colspan="6"><div class="empty"><b>Noch keine Artikel</b>' +
        '<span>Oben auf „Neuer Artikel" tippen.</span></div></td></tr>';
      return;
    }
    if (!gefiltert.length) {
      tb.innerHTML = '<tr><td colspan="6"><div class="empty"><b>Nichts gefunden</b>' +
        '<span>Andere Suche versuchen.</span></div></td></tr>';
      return;
    }

    gefiltert.forEach(function (a) {
      var tr = document.createElement('tr');
      if (bearbeitet === a.code) tr.className = 'editing';
      tr.innerHTML =
        '<td class="num strong">' + esc(a.code) + '</td>' +
        '<td class="strong">' + esc(a.name) + '</td>' +
        '<td>' + esc(a.lieferant) + '</td>' +
        '<td>' + esc(a.einheit) + '</td>' +
        '<td>' + (a.ort ? esc(a.ort) : '<span style="color:var(--text-faint)">—</span>') + '</td>' +
        '<td><div class="cellbtns">' +
          '<button class="b b-secondary b-sm" data-act="edit" data-code="' + esc(a.code) + '">Bearbeiten</button>' +
          '<button class="b b-danger b-sm" data-act="del" data-code="' + esc(a.code) + '">' +
            (loeschKandidat === a.code ? 'Wirklich löschen?' : 'Löschen') +
          '</button>' +
        '</div></td>';
      tb.appendChild(tr);
    });
  }

  document.getElementById('list').addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-act]');
    if (!btn) return;
    var code = btn.getAttribute('data-code');
    if (btn.getAttribute('data-act') === 'edit') { formOeffnen(code); return; }

    /* Löschen: erster Klick fragt, zweiter führt aus */
    if (loeschKandidat !== code) {
      loeschKandidat = code;
      say('warn', 'Sicher? ', 'Nochmal auf „Wirklich löschen?" tippen, dann ist ' +
        finde(code).name + ' weg — samt Bestand. Ein Klick woanders bricht ab.');
      render();
      return;
    }
    var name = finde(code).name;
    liste = liste.filter(function (x) { return x.code !== code; });
    loeschKandidat = null;
    if (bearbeitet === code) formSchliessen();
    speichern();
    say('ok', 'Gelöscht. ', name + ' ist aus dem Artikelstamm entfernt.');
    render();
  });

  document.addEventListener('click', function (e) {
    if (!loeschKandidat) return;
    if (e.target.closest('button[data-act="del"]')) return;
    loeschKandidat = null;
    clearMsg();
    render();
  });

  render();
})();
</script>
