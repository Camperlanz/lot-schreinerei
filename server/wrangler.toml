name = "lot-api"
main = "worker.js"
compatibility_date = "2026-09-01"

# Die Datenbank wird beim Anlegen mit ihrer Kennung ergaenzt:
#   npx wrangler d1 create lot
# Die ausgegebene database_id hier eintragen.
[[d1_databases]]
binding = "DB"
database_name = "lot-weur"
database_id = "82d2d946-0c95-4cb2-8d59-043e57550881"

[vars]
# Von welcher Adresse aus die Seiten zugreifen duerfen.
# Waehrend der Entwicklung steht hier *, spaeter die echte Adresse.
ERLAUBT = "*"
